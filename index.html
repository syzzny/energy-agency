<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="에너지전환진흥원 공식 누리집 — 재생에너지 보급과 에너지 효율 혁신으로 탄소중립 사회를 앞당깁니다." />
  <meta name="theme-color" content="#1d5bd8" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!--
    웹폰트 CSS 는 화면 그리기를 막지 않도록 비동기로 불러온다 (렌더링 차단 요청 제거).
    받기 전에는 시스템 글꼴로 먼저 보여 주고, 받으면 바꿔 끼운다 (font-display: swap).
  -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" />
  </noscript>
  <script>
    // 메인 화면이면 첫 비주얼 이미지(LCP)를 자바스크립트보다 먼저 받기 시작한다
    (function () {
      var base = '%BASE_URL%';
      var path = location.pathname;
      if (path === base || path + '/' === base) {
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.href = base + 'images/photo-wind.webp';
        link.setAttribute('fetchpriority', 'high');
        document.head.appendChild(link);
      }
    })();
  </script>
  <title>에너지전환진흥원</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
